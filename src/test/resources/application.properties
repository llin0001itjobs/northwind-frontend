# Minimal safe settings for tests
spring.profiles.active=test

# === Database: Use H2 In-Memory ===
spring.datasource.driver-class-name=org.h2.Driver
# 'delay=-1' keeps the database alive until the JVM shuts down
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Automatically create/drop the schema for a clean slate each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


# === Email: Disable SMTP Connectivity ===
# Setting the host to a non-existent local address prevents external calls
spring.mail.host=localhost
spring.mail.port=3025
# Alternatively, disable the mail service entirely if your code handles it
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# === OAuth2 / Security: Mock Credentials ===
# Use dummy values to satisfy Spring's startup checks without hitting GitHub
spring.security.oauth2.client.registration.github.client-id=test-id
spring.security.oauth2.client.registration.github.client-secret=test-secret
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code

# === Testing Environment ===
# Ensure the test context doesn't try to connect to real Azure/External resources
spring.main.allow-bean-definition-overriding=true

# Optional: reduce logging noise during tests
logging.level.org.springframework=warn
logging.level.org.springframework.security=warn