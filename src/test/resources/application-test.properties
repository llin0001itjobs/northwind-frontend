# === Email: Disable SMTP Connectivity ===
# Setting the host to a non-existent local address prevents external calls
spring.mail.host=localhost
spring.mail.port=3025
# Alternatively, disable the mail service entirely if your code handles it
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# === H2 (used by @DataJpaTest and full tests) ===
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER,TYPE;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# === Disable real external services (we mock or override them) ===
spring.cloud.azure.keyvault.secret.enabled=false
spring.cloud.azure.keyvault.secret.property-source-enabled=false


spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code

# Required for H2/Mock testing to avoid context failure
spring.security.oauth2.client.provider.github.authorization-uri=http://localhost:8080/auth
spring.security.oauth2.client.provider.github.token-uri=http://localhost:8080/token
spring.security.oauth2.client.provider.github.user-info-uri=http://localhost:8080/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# === Testing Environment ===
# Ensure the test context doesn't try to connect to real Azure/External resources
spring.main.allow-bean-definition-overriding=true

# Optional: reduce logging noise during tests
logging.level.org.springframework=warn
logging.level.org.springframework.security=warn

management.health.mail.enabled=false

