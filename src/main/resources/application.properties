app.api.dogs.images.random=https://dog.ceo/api/breeds/image/random
app.api.pkg.northwind=org.llin.demo.northwind.model
app.api.pkg.excluded=ProductSupplier,User
app.api.pkg.sample=1,2,3,4,5
app.api.usage=true

app.data.api-uri=http://localhost:8080/northwind-data/api/
app.data.regex-api-uri=^http://localhost:8080\\/northwind-data\\/api\\/\\w+\\/\\d+\\/\\w+\\?id=(\\w+(?:,\\w+)*)$

# App-specific mail texts
app.mail.subject.verified=Email verified
app.mail.subject.registered=Registration successful
app.mail.text.verified=Email verified. Please log in.
app.mail.text.registered=Registration successful. You can now log in.

app.security.remember-me.secret=QmFzZTY0U3RyaW5nU2FtcGxlNzg=

app.view.ellipsis.limit=150

app.employee-chunk-size=7
app.image-base-path=/src/main/resources/

# Email settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring resources
spring.mvc.static-path-pattern=/static/**
spring.resources.static-locations=classpath:/static/

# === GitHub OAuth2 Client Registration ===
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23lirMTkF1qclE9739}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:ced667f0f64f1b4767d01abcd1c186a557c6b0a6}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub


# === Facebook ===
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-name=Facebook

# === GitHub Provider (you can keep these or remove them and let Spring Boot use the built-in "github" provider) ===
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# === Google ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Security 
spring.security.debug=true
spring.security.user.name=scott
spring.security.user.password=tiger

# Thymeleaf 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

logging.level.com.azure.spring.cloud=DEBUG
logging.level.com.sun.mail=DEBUG
logging.level.jakarta.mail=DEBUG
logging.level.org.springframework.boot.context.properties=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=INFO
logging.level.value=DEBUG
logging.level.web=DEBUG

# Optional but useful
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,beans,mappings,threaddump,env,configprops
management.info.env.enabled=true




