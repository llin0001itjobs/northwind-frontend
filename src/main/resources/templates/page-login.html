<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org"
	xmlns:sec="http://thymeleaf.org/extras/spring-security">
<!-- page-login.html -->
<head>
<meta charset="utf-8">
<title>sign in</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link rel="stylesheet" id="roboto-subset.css-css"
	href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/docs-app/css/mdb5/fonts/roboto-subset.css?ver=3.9.0-update.5"
	type="text/css" media="all">

<link rel="stylesheet"
	href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/docs-app/css/dist/mdb5/standard/core.min.css">

<style>
.divider:after, .divider:before {
	content: "";
	flex: 1;
	height: 1px;
	background: #eee;
}
</style>

</head>
<body
	class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

	<!-- Main Content Container -->
	<section class="w-100 px-4 py-5">


		<div class="row d-flex justify-content-center">
			<div class="col-md-8 col-lg-7 col-xl-6">
				<img th:src="@{/images/girl_key.png}" class="img-fluid"
					alt="Phone image">
			</div>
			<div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
				<form class="form-signin" method="post" th:action="@{/login}"
					th:object="${user}">
					<!-- Email input -->
					<div data-mdb-input-init="" class="form-outline mb-4"
						data-mdb-input-initialized="true">
						<input type="text" id="username"
							class="form-control form-control-lg"
							data-ddg-inputtype="credentials.username"
							th:field="*{username}"> 
							<label class="form-label" for="username" 
							style="margin-left: 0px;">User Name</label> 
						
						<input type="email"
							id="email" class="form-control form-control-lg"
							data-ddg-inputtype="credentials.username"
							th:field="*{email}"> 
						<label
							class="form-label" for="email" 
							style="margin-left: 0px;">Email address</label>
						<div class="form-notch">
							<div class="form-notch-leading" style="width: 9px;"></div>
							<div class="form-notch-middle" style="width: 88.8px;"></div>
							<div class="form-notch-trailing"></div>
						</div>
					</div>

					<!-- Password input -->
					<div data-mdb-input-init="" class="form-outline mb-4"
						data-mdb-input-initialized="true">
						<input type="password" id="password"
							class="form-control form-control-lg" th:field="*{password}"
							data-ddg-inputtype="credentials.password.current" required
							pattern="^(?=.*[a-z])(?=.*[a-z])(?=.*\d).{8,}$"
							title="must contain at least 1 uppercase letter, 1 lowercase letter, 1 number, and be 8+ characters long.">
						<label class="form-label" for="password" style="margin-left: 0px;">Password</label>
						<div class="form-notch">
							<div class="form-notch-leading" style="width: 9px;"></div>
							<div class="form-notch-middle" style="width: 64.8px;"></div>
							<div class="form-notch-trailing"></div>
						</div>
					</div>

					<div class="d-flex justify-content-around align-items-center mb-4">
						<!-- Checkbox -->
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value=""
								id="rememberMe" checked=""> <label
								class="form-check-label" for="rememberMe"> Remember me </label>
						</div>
						<a th:href="@{/forgotpassword}">Forgot password?</a>
					</div>

					<!-- Submit button -->
					<button type="submit" data-mdb-button-init=""
						data-mdb-ripple-init="" class="btn btn-primary btn-lg btn-block"
						data-mdb-button-initialized="true">Sign in</button>

					<div class="divider d-flex align-items-center my-4">
						<p class="text-center fw-bold mx-3 mb-0 text-muted">OR</p>
					</div>

					<a data-mdb-ripple-init="" class="btn btn-primary btn-lg btn-block"
						style="background-color: #3b5998" href="#!" role="button"> <i
						class="fab fa-facebook-f me-2"></i>Continue with Facebook
					</a> <a data-mdb-ripple-init=""
						th:href="@{/oauth2/authorization/github}"
						class="btn btn-primary btn-lg btn-block"
						style="background-color: #55acee" href="#!" role="button"> <i
						class="fab fa-twitter me-2"></i>Continue with GitHub
					</a>

				</form>
			</div>
		</div>

	</section>

	<!-- Footer Fragment -->
	<div class="container footer-container mt-auto pb-3">
		<div th:replace="~{fragments/footer :: footer}"></div>
	</div>

	<!-- Script Fragment -->
	<div th:replace="~{fragments/script :: div}"></div>

</body>
</html>
