<div th:fragment="linksJs">

	<!-- jQuery (still required by DataTables + Buttons) -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<!-- Bootstrap 5.3 bundle (matches the CSS version) -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- DataTables 2.x core (match the CSS version) -->
	<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
	<script
		src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>

	<!-- Buttons + export dependencies -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/dataTables.buttons.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.bootstrap5.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.html5.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.print.min.js"></script>

	<!-- Optional extensions (only if you actually use them) -->
	<script
		src="https://cdn.datatables.net/fixedcolumns/5.0.4/js/dataTables.fixedColumns.min.js"></script>
	<script
		src="https://cdn.datatables.net/fixedheader/4.0.1/js/dataTables.fixedHeader.min.js"></script>
	<script
		src="https://cdn.datatables.net/scroller/2.4.3/js/dataTables.scroller.min.js"></script>


	<script th:inline="none">
		console.log('init running');
		if ($('#dataTable').length) {
			var table = $('#dataTable');
			var crudButtonsHtml = $('#crudButtonsTemplate').html() || '';
			table
					.DataTable({
						pageLength : table.data('page-length') || 10,
						lengthChange : false,
						searching : true,
						order : [ [ 1, 'asc' ] ], // Updated to sort by 2nd column 'Name' (index 1) in ascending order
						columnDefs : [ {
							targets : 0, // Updated to disable sorting on the radio button column (index 0)
							orderable : false
						} ],
						layout : {
							topStart : null,
							topEnd : [
									'search',
									function(settings) {
										// Custom node for the CRUD buttons
										var container = document
												.createElement('div');
										container.id = 'topMenuCRUDBar';
										container.className = 'd-inline-flex align-items-center ms-2';
										container.innerHTML = crudButtonsHtml;
										return container;
									} ]
						}
					});
		}
	</script>

	<script>
		function onClickCRUD(e) {
			// e can be the button element (if you pass `this`) or the event object
			const button = e.target ? e.target : e;
			const buttonName = button.dataset.action || button.id
					|| button.textContent.trim();

			// Get the currently selected radio
			const selectedRadio = document
					.querySelector('input[name="radioId"]:checked');
			const selectedId = selectedRadio ? selectedRadio.value : null;
			const radioId = selectedRadio ? selectedRadio.id : null;

			console.log({
				button : buttonName,
				selectedId : selectedId,
				radioId : radioId
			});

			// Optional: show an alert while you debug
			alert(`Button: ${buttonName}\nSelected ID: ${selectedId || 'none'}\nRadio ID: ${radioId || 'none'}`);
		}

		document.addEventListener('click', function(e) {
			const btn = e.target.closest('[data-action]'); // or closest('button')
			if (!btn)
				return;

			// Only react to the four CRUD buttons
			const action = btn.dataset.action;
			if ([ 'view', 'add', 'edit', 'del' ].includes(action)) {
				onClickCRUD(btn); // or onClickCRUD(e) if you prefer the event object
			}
		});
	</script>

</div>
