<div th:fragment="linksJs">

	<!-- jQuery (still required by DataTables + Buttons) -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<!-- Bootstrap 5.3 bundle (matches the CSS version) -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- DataTables 2.x core (match the CSS version) -->
	<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
	<script
		src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>

	<!-- Buttons + export dependencies -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/dataTables.buttons.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.bootstrap5.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.html5.min.js"></script>
	<script
		src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.print.min.js"></script>

	<!-- Optional extensions (only if you actually use them) -->
	<script
		src="https://cdn.datatables.net/fixedcolumns/5.0.4/js/dataTables.fixedColumns.min.js"></script>
	<script
		src="https://cdn.datatables.net/fixedheader/4.0.1/js/dataTables.fixedHeader.min.js"></script>
	<script
		src="https://cdn.datatables.net/scroller/2.4.3/js/dataTables.scroller.min.js"></script>


	<script th:inline="none">
		console.log('init running');
		if ($('#dataTable').length) {
			var table = $('#dataTable');
			var crudButtonsHtml = $('#crudButtonsTemplate').html() || '';
			table
					.DataTable({
						pageLength : table.data('page-length') || 10,
						lengthChange : false,
						searching : true,
						order : [ [ 1, 'asc' ] ], // Updated to sort by 2nd column 'Name' (index 1) in ascending order
						columnDefs : [ {
							targets : 0, // Updated to disable sorting on the radio button column (index 0)
							orderable : false
						} ],
						layout : {
							topStart : null,
							topEnd : [
									'search',
									function(settings) {
										// Custom node for the CRUD buttons
										var container = document
												.createElement('div');
										container.id = 'topMenuCRUDBar';
										container.className = 'd-inline-flex align-items-center ms-2';
										container.innerHTML = crudButtonsHtml;
										return container;
									} ]
						}
					});
		}
	</script>

	<script>
		function onClickCRUD(e) {
			
			const button = e.target ? e.target : e;
			const action = button.dataset.action || button.id || button.textContent.trim();

			const selectedRadio = document.querySelector('input[name="radioId"]:checked');
			const selectedId = selectedRadio ? selectedRadio.value : null;

			if (!selectedId && ['view', 'edit', 'del'].includes(action)) {
			    alert('Please make a selection first');
			    return;
			}

			  // Get entity type from the table (or body, or a data attribute on the buttons)
			const rawType = document.querySelector('#dataTable')?.dataset.entityType || 'customer';
			const entityType = rawType.charAt(0).toUpperCase() + rawType.slice(1);

			
			let modalId;
			if (action === 'add') {
			  // Always use the dedicated new modal
			  modalId = 'modalEdit' + entityType + '-new';
			} else {
			  // View / Edit / Delete need a selected row
			  if (!selectedId) {
			    alert('Please select a row first');
			    return;
			  }
			  modalId = 'modalEdit' + entityType + '-' + selectedId;
			}

			const modalEl = document.getElementById(modalId);
			if (!modalEl) {
			  console.warn('Modal not found:', modalId);
			  return;
			}
			
			
			// Now safe to use modalEl
			if (!modalEl.dataset.baseTitle) {
			  const titleEl = modalEl.querySelector('.modal-title');
			  modalEl.dataset.baseTitle = titleEl ? titleEl.textContent.trim() : entityType;
			}
			
			const baseTitle = modalEl.dataset.baseTitle;

			
			// Map actions to display labels and HTTP methods
			const actionConfig = {
				add : {
					label : 'Add',
					method : 'post'
				},
				view : {
					label : 'View',
					method : 'get'
				},
				edit : {
					label : 'Edit',
					method : 'put'
				},
				del : {
					label : 'Delete',
					method : 'delete'
				}
			}[action] || {
				label : 'Submit',
				method : 'post'
			};

			// Pass data to modal
			modalEl.dataset.action = action;
			modalEl.dataset.customerId = selectedId || '';

			// 1. Update Modal Title
			const title = modalEl.querySelector('.modal-title');
			if (title) {
				title.textContent = `${actionConfig.label} ${baseTitle}`;
			}

			// 2. Update Form Method Attribute
			const form = modalEl.querySelector('form');
			if (form) {
				form.setAttribute('method', actionConfig.method);
			}

			// 3. Update Submit Button Text/Value
			const submitBtn = modalEl.querySelector('.post-entity:not(form),.post-customer');
			if (submitBtn) {
				submitBtn.textContent = actionConfig.label;
				submitBtn.value = actionConfig.label;
			}

			// 4. Read-only for view / delete
			const isReadOnly = ['view', 'del'].includes(action);
			modalEl.querySelectorAll('input.form-control').forEach(function(input) {
			  input.readOnly = isReadOnly;
			  // optional: visual cue
			  input.classList.toggle('bg-light', isReadOnly);
			});

			const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
			modal.show();
		}

		document.addEventListener('click', function(e) {
			const btn = e.target.closest('[data-action]'); // or closest('button')
			if (!btn)
				return;

			// Only react to the four CRUD buttons
			const action = btn.dataset.action;
			if ([ 'view', 'add', 'edit', 'del' ].includes(action)) {
				onClickCRUD(btn); // or onClickCRUD(e) if you prefer the event object
			}
		});
		
		// Shared submit handler for all entity modals
		document.addEventListener('click', async function (e) {
		  var btn = e.target.closest('.post-entity');
		  if (!btn) return;
		
		  var form = btn.closest('form');
		  if (!form) return;
		
		  var method = (form.getAttribute('method') || 'POST').toUpperCase();
		  var modalEl = form.closest('.modal');
		  var entityIdEl = form.querySelector('.entity-id');
		  var entityId = entityIdEl ? entityIdEl.value : null;
		
		  // View: just close
		  if (method === 'GET') {
		    var modalInstance = bootstrap.Modal.getInstance(modalEl);
		    if (modalInstance) modalInstance.hide();
		    return;
		  }
		
		  // Entity-specific DTO builder
		  var builders = window.entityDtoBuilders || {};
		  var builder = builders[form.dataset.entityType];
		  if (!builder) {
		    console.error('No DTO builder registered for', form.dataset.entityType);
		    return;
		  }
		
		  var dto = builder(form);
		  if (!dto) return;
		
		  var baseUrl = form.dataset.baseUrl || '/entity/customer';
		  var url = method === 'DELETE' ? baseUrl + '/' + entityId : baseUrl;
		
		  var fetchOptions = {
		    method: method,
		    headers: { 'Content-Type': 'application/json' }
		  };
		  if (method !== 'DELETE') {
		    fetchOptions.body = JSON.stringify(dto);
		  }
		
		  try {
		    var resp = await fetch(url, fetchOptions);
		    if (resp.ok) {
		      var inst = bootstrap.Modal.getInstance(modalEl);
		      if (inst) inst.hide();
		      location.reload();
		    } else {
		      console.error(method + ' failed', resp.status);
		    }
		  } catch (err) {
		    console.error(err);
		  }
		});
		
		function toCamelCase(str) {
			  return str
			    .trim()
			    .split(/[\s_-]+/) // Splits by spaces, underscores, or hyphens
			    .map((word, index) => {
			      if (index === 0) {
			        return word.toLowerCase();
			      }
			      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
			    })
			    .join('');
			}
		
		function toCamelCaseNotFirst(str) {
			  return str
			    .trim()
			    .split(/[\s_-]+/) // Splits by spaces, underscores, or hyphens
			    .map((word, index) => {
			      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
			    })
			    .join('');
			}		
		
	</script>

</div>
