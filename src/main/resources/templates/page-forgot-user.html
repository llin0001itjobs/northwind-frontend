<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Forgot user</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet"
	href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/docs-app/css/dist/mdb5/standard/core.min.css">
</head>
<body
	class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
	<section class="w-100 px-4 py-5">
		<div class="row d-flex justify-content-center">
			<div class="col-12 col-md-5 col-lg-5 col-xl-5 mb-4 mb-md-0">
				<img th:src="@{/images/girl_key.png}" class="img-fluid"
					alt="Girl and Key">
			</div>
			<div class="col-12 col-md-7 col-lg-6 col-xl-5">
				<h4 class="mb-3">Forgot user</h4>
				<p class="text-muted">Enter the email on your account. If it
					matches a user, we’ll send the username.</p>

				<div th:if="${message != null and message.containsKey('errors')}"
					class="fw text-danger mb-3">
					<span th:text="${message.errors}"></span>
				</div>

				<form method="post" th:action="@{/forgotuser}" th:object="${user}">
					<div class="form-outline mb-4">
						<input type="email" id="email"
							class="form-control form-control-lg" th:field="*{email}" required>
						<label class="form-label" for="email">Email</label>
					</div>
					<button type="submit" class="btn btn-primary btn-lg btn-block">Send
						username</button>
					<div class="text-center mt-3">
						<a th:href="@{/login}">Back to sign in</a>
					</div>
				</form>
			</div>
		</div>
	</section>
	<div class="container footer-container mt-auto pb-3">
		<div th:replace="~{fragments/footer :: footer}"></div>
	</div>
	<div th:replace="~{fragments/script :: div}"></div>
</body>
</html>
