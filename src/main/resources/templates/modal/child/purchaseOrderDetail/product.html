<!DOCTYPE html>
<!-- modal/child/purchaseOrderDetail/product.html -->
<!-- one modal per purchaseOrderDetail -->
<div th:each="p : ${PurchaseOrderDetails}" th:if="${p.id != null}"
	th:attr="id='modalProduct-' + ${p.id}" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" th:attr="id='modalProduct-' + ${p.id}">
					Product of Date Received <span th:text="${p.dateReceived}"></span>
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<table class="table modal-table">
					<thead>
						<tr>
							<th scope="col">Product Code</th>
							<th scope="col">Product Name</th>
							<th scope="col">Category</th>
							<th scope="col">Standard Cost</th>
							<th scope="col">List Price</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${p.product != null}">
							<td><span th:text="${p.product.productCode}"></span></td>
							<td><span th:text="${p.product.productName}"></span></td>
							<td><span th:text="${p.product.category}"></span></td>
							<td><span th:text="${p.product.standardCost}"></span></td>
							<td><span th:text="${p.product.listPrice}"></span></td>
						</tr>
						<tr th:if="${p.product == null}">
							<td colspan="6" class="text-muted">No Product</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
