<!DOCTYPE html>
<div th:each="p : ${Products}" class="modal fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	th:attr="id='modalProduct-' + ${p.id}, aria-labelledby='modalProductLabel-' + ${p.id}"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalProductLabel-' + ${p.id}">
					Product
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<dl class="row">
					<dt class="col">Product Code</dt>
					<dd class="col">
						<span th:text="${p.productCode}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">Product Name</dt>
					<dd class="col">
						<span th:text="${p.productName}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">Category</dt>
					<dd class="col">
						<span th:text="${p.category}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">Standard Cost</dt>
					<dd class="col">
						<span th:text="${p.standardCost}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">List Price</dt>
					<dd class="col">
						<span th:text="${p.listPrice}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">Quantity Per Unit</dt>
					<dd class="col">
						<span th:text="${p.quantityPerUnit}"></span>
					</dd>
				</dl>
				<dl class="row">
					<dt class="col">Minimum Reorder Quantity</dt>
					<dd class="col">
						<span th:text="${p.minimumReorderQuantity}"></span>
					</dd>
				</dl>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
