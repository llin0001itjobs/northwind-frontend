<!DOCTYPE html>
<!-- modal/child/orderDetail/product.html -->
<!-- one modal per orderDetail -->
<div th:each="o : ${OrderDetails}" th:if="${o.id != null}"
	th:attr="id='modalProduct-' + ${o.id}" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" th:attr="id='modalProduct-' + ${o.id}">
					Product of of Date Allocated<span th:text="${o.dateAllocated}"></span>
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<table class="table modal-table">
					<thead>
						<tr>
							<th scope="col">Product Code</th>
							<th scope="col">Product Name</th>
							<th scope="col">Category</th>
							<th scope="col">Standard Cost</th>
							<th scope="col">List Price</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${o.product != null}">
							<td><span th:text="${o.product.productCode}"></span></td>
							<td><span th:text="${o.product.productName}"></span></td>
							<td><span th:text="${o.product.category}"></span></td>
							<td><span th:text="${o.product.standardCost}"></span></td>
							<td><span th:text="${o.product.listPrice}"></span></td>
						</tr>
						<tr th:if="${o.product == null}">
							<td colspan="6" class="text-muted">No Product</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
