<!DOCTYPE html>
<!-- modal/child/inventoryTransaction/purchaseOrder.html -->
<!-- one modal per inventoryTransaction -->
<div th:each="i : ${InventoryTransactions}" th:if="${i.id != null}"
	th:attr="id='modalPurchaseOrder-' + ${i.id}"
	class="modal modal-lg fade" data-bs-backdrop="static"
	data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" th:attr="id='modalPurchaseOrder-' + ${i.id}">
					Purchase Order of Created Date <span th:text="${i.transactionCreatedDate}"></span>
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<table class="table modal-table">
					<thead>
						<tr>
							<th scope="col">Approved Date</th>
							<th scope="col">Submitted Date</th>
							<th scope="col">Created Date</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${i.purchaseOrder != null}">
							<td><span
								th:text="${#temporals.format(i.purchaseOrder.approvedDate, 'dd-MM-yyyy HH:mm')}"></span></td>
							<td><span
								th:text="${#temporals.format(i.purchaseOrder.submittedDate, 'dd-MM-yyyy HH:mm')}"></span</td>
							<td><span
								th:text="${#temporals.format(i.purchaseOrder.createdDate, 'dd-MM-yyyy HH:mm')}"></span></td>
						</tr>
						<tr th:if="${i.purchaseOrder == null}">
							<td colspan="6" class="text-muted">No Purchase Order</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
