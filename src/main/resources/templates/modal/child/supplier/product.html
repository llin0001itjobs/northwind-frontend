<!DOCTYPE html>
<div th:each="s : ${Suppliers}" class="modal modal-xl fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	th:attr="id='modalProduct-' + ${s.id}, aria-labelledby='modalProductLabel-' + ${s.id}"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalProductLabel-' + ${s.id}">
					Product
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<table class="table modal-table">
					<thead>
						<tr>
							<th scope="col">Product Code</th>
							<th scope="col">Product Name</th>
							<th scope="col">Category</th>
							<th scope="col">Standard Cost</th>
							<th scope="col">List Price</th>
							<th scope="col">Quantity Per Unit</th>
							<th scope="col">Minimum Reorder Quantity</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${s.products.products}">
							<td><span th:text="${p.productCode}"></span></td>
							<td><span th:text="${p.productName}"></span></td>
							<td><span th:text="${p.category}"></span></td>
							<td><span th:text="${p.standardCost}"></span></td>
							<td><span th:text="${p.listPrice}"></span></td>
							<td><span th:text="${p.quantityPerUnit}"></span></td>
							<td><span th:text="${p.minimumReorderQuantity}"></span></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
