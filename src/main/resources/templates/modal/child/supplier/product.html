<!DOCTYPE html>
<!-- modal/child/supplier/product.html -->
<!-- one modal per supplier -->
<div th:each="s : ${Suppliers}" th:if="${s.id != null}"
	th:attr="id='modalProduct-' + ${s.id}" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" th:attr="id='modalSupplierLabel-' + ${s.id}">
					Products for <span th:text="${s.company?.name}"></span>
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<table class="table modal-table">
					<thead>
						<tr>
							<th scope="col">Product Code</th>
							<th scope="col">Product Name</th>
							<th scope="col">Category</th>
							<th scope="col">Standard Cost</th>
							<th scope="col">List Price</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${s.products?: {}}">
							<td><span th:text="${p.productCode}"></span></td>
							<td><span th:text="${p.productName}"></span></td>
							<td><span th:text="${p.category}"></span></td>
							<td><span th:text="${p.standardCost}"></span></td>
							<td><span th:text="${p.listPrice}"></span></td>
						</tr>
						<tr th:if="${s.products == null or #lists.isEmpty(s.products)}">
							<td colspan="6" class="text-muted">No products</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
