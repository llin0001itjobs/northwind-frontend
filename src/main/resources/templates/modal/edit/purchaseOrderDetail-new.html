<!DOCTYPE html>
<!-- /templates/modal/edit/purchaseOrderDetail-new.html -->
<div id="modalEditPurchaseOrderDetail-new"
	th:fragment="modalEditPurchaseOrderDetail-new"
	class="modal modal-lg fade" data-bs-backdrop="static"
	data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalEditPurchaseOrderDetailLabel-new">Purchase
					Order Detail</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="form-purchaseOrderDetail-new"
					th:action="@{/entity/purchaseOrderDetail}" method="post"
					data-entity-type="PurchaseOrderDetail" class="post-entity">
					<input type="hidden" name="id" value="0" class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">Date Received</div>
						<div class="col-10">
							<input type="date" name="dateReceived"
								class="date-received form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Unit Cost</div>
						<div class="col-10">
							<input type="number" step="0.1" name="unitCost"
								class="unit-cost form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Quantity</div>
						<div class="col-10">
							<input type="number" step="1" name="quantity"
								class="quantity form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Posted To Inventory</div>
						<div class="col-10">
							<select name="postedToInventory"
								class="posted-to-inventory form-control">
								<option value="false">False</option>
								<option value="true">True</option>
							</select>
						</div>
					</div>
					<div class="row mt-3">
						<div class="col-6 text-end pe-2">
							<button type="button" class="btn btn-secondary post-entity">Submit</button>
						</div>
						<div class="col-6 text-start ps-2">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
