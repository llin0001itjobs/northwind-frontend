<!DOCTYPE html>
<!-- /templates/modal/edit/purchaseOrder.html -->
<div th:each="po : ${PurchaseOrders}" th:if="${po.id != null}"
	th:attr="id='modalEditPurchaseOrder-' + ${po.id}"
	th:fragment="modalEditPurchaseOrder" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" th:attr="id='editPurchaseOrder-' + ${po.id}">
					Purchase Order</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
				<div class="modal-body">
					<form th:id="|form-${po.id}|" th:action="@{/entity/purchaseOrder}"
						method="post">
						<div class="row align-items-end">
							<div class="col-2">Approved Date</div>
							<div class="col-10">
								<input type="date" th:value="${p.approvedDate}"
									class="approved-date form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Submitted Date</div>
							<div class="col-10">
								<input type="date" th:value="${p.submittedDate}"
									class="submitted-date form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Creation Date</div>
							<div class="col-10">
								<input type="date" th:value="${p.creationDate}"
									class="creation-date form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Expected Date</div>
							<div class="col-10">
								<input type="date" th:value="${p.expectedDate}"
									class="expected-date form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Payment Date</div>
							<div class="col-10">
								<input type="date" th:value="${p.paymentDate}"
									class="payment-date form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Shipping Fee</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${p.shippingFee}"
									class="shipping-fee form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Taxes</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${p.taxes}"
									class="taxes form-control" />
							</div>
						</div> 
						<div class="row align-items-end">
							<div class="col-2">Payment Amount</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${p.paymentAmount}"
									class="payment-amount form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Payment Method</div>
							<div class="col-10">
								<input type="text" th:value="${p.paymentMethod}"
									class="payment-method form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Notes</div>
							<div class="col-10">
								<input type="text" th:value="${p.notes}"
									class="notes form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Approved By</div>
							<div class="col-10">
								<select th:value="${p.approvedBy}"
									class="approved-by form-control">

								</select>
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Created By</div>
							<div class="col-10">
								<select th:value="${p.createdBy}"
									class="created-by form-control">
								</select>
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Submitted By</div>
							<div class="col-10">
								<select th:value="${p.submittedBy}"
									class="submitted-by form-control" /> </select>
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Order Status</div>
							<div class="col-10">
								<select th:value="${p.orderStatus}"
									class="order-status form-control" /> </select>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
	window.entityDtoBuilders = window.entityDtoBuilders || {};
	window.entityDtoBuilders.purchaseOrder = function (form) {
	  return {   
	    id: form.querySelector('.entity-id')?.value,
	    quantity: form.querySelector('.quantity')?.value,   		
	    unitPrice: form.querySelector('.unit-price')?.value,
	    paymentDate: form.querySelector('.payment-date')?.value,
	    shippingFee: form.querySelector('.shipping-fee')?.value,   		
	    taxes: form.querySelector('.taxes')?.value,	    		
	    paymentDate: form.querySelector('.payment-date')?.value,
	   	shippingFee: form.querySelector('.shipping-fee')?.value,   		
	    taxes: form.querySelector('.taxes')?.value,	    		
	    paymentAmount: form.querySelector('.payment-amount')?.value,
	    paymentMethod: form.querySelector('.payment-method')?.value,	    		
	    notes: form.querySelector('.notes')?.value,   		
		approvedBy: form.querySelector('.approved-by')?.value,    
		createdBy: form.querySelector('.created-by')?.value,
		submittedBy: form.querySelector('.submitted-by')?.value,
		orderStatus: form.querySelector('.order-status')?.value
	  }; 
	};
</script>
