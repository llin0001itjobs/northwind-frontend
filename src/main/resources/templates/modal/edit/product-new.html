<!DOCTYPE html>
<!-- /templates/modal/edit/product-new.html -->
<div id="modalEditProduct-new" th:fragment="modalEditProduct-new"
	class="modal modal-lg fade" data-bs-backdrop="static"
	data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalEditProductLabel-new">Product</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="form-product-new" th:action="@{/entity/product}"
					method="post" data-entity-type="Product" class="post-entity">
					<input type="hidden" name="id" value="0" class="entity-id" />
							<div class="col-2">Product Code</div>
							<div class="col-10">
								<select name="productCode" class="product-code form-control">
									<option value="">Please select a Product Code</option>
									<option th:each="p : ${ProductCodes}" name="code}"
										th:text="${p.code}"></option>
								</select>
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Category</div>
							<div class="col-10">
								<select name="category" class="category form-control">
									<option value="">Please select a Product Code</option>
									<option th:each="p : ${Categories}" name="category}"
										th:text="${p.category}"></option>
								</select>
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Standard Cost</div>
							<div class="col-10">
								<input type="number" step="0.1" name="standardCost"
									class="standard-cost form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">List Price</div>
							<div class="col-10">
								<input type="number" step="0.1" name="listPrice"
									class="list-price form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Quantity Per Unit</div>
							<div class="col-10">
								<input type="number" step="1" name="quantityPerUnit"
									class="quantity-per-unit form-control" />

							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Minimum Reorder Quantity</div>
							<div class="col-10">
								<input type="number" step="1" name="minimumReorderQuantity"
									class="minimum-reorder-quantity form-control" />
							</div>
						</div>
						<div class="row mt-3 mb-3">
							<div class="col-6 text-end pe-2">
								<button type="button" class="btn btn-secondary post-entity">Submit</button>
							</div>
							<div class="col-6 text-start ps-2">
								<button type="button" class="btn btn-secondary"
									data-bs-dismiss="modal">Close</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
