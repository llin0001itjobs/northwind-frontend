<!DOCTYPE html>
<!-- /templates/modal/edit/orderDetail-new.html -->
<div id="modalEditOrderDetail-new"
	th:fragment="modalEditOrderDetail-new" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalEditOrderDetailLabel-new">Order
					Detail</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="form-orderDetail-new" th:action="@{/entity/orderDetail}"
					method="post" data-entity-type="OrderDetail" class="post-entity">
					<input type="hidden" name="id" value="0" class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">Quantity</div>
						<div class="col-10">
							<input type="number" step="0.1" name="quantity"
								class="quantity form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Unit Price</div>
						<div class="col-10">
							<input type="number" step="0.1" name="unitPrice"
								class="unit-price form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Discount</div>
						<div class="col-10">
							<input type="number" step="0.1" name="discount"
								class="discount form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Date Allocated</div>
						<div class="col-10">
							<input type="date" name="dateAllocated"
								class="date-allocated form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Order Status</div>
						<div class="col-10">
							<select name="orderStatus" class="order-status form-control" />
							</select>
						</div>
					</div>
					<div class="row mt-3">
						<div class="col-6 text-end pe-2">
							<button type="button" class="btn btn-secondary post-entity">Submit</button>
						</div>
						<div class="col-6 text-start ps-2">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
