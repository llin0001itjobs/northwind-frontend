<!DOCTYPE html>
<!-- /templates/modal/edit/invoice.html -->
<div th:each="i : ${Invoices}" th:if="${i.id != null}"
	th:attr="id='modalEditInvoice-' + ${i.id}"
	th:fragment="modalEditInvoice" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalEditInvoiceLabel-' + ${i.id}">Invoice</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form th:id="|form-${i.id}|" th:action="@{/entity/invoice}"
					method="post" data-entity-type="Invoice" class="post-entity">
					<input type="hidden" th:value="${i.id}" th:id="|customer-${i.id}|"
						class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">Invoice Date</div>
						<div class="col-10">
							<input type="date" th:value="${i.invoiceDate}"
								class="invoice-date form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Due Date</div>
						<div class="col-10">
							<input type="date" th:value="${i.dueDate}"
								class="due-date form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Tax</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${i.tax}"
								class="tax form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Shipping</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${i.shipping}"
								class="shipping form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Amount Due</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${i.amountDue}"
								class="amount-due form-control" />
						</div>
					</div>
					<div class="row mt-3">
						<div class="col-6 text-end pe-2">
							<button type="button" class="btn btn-secondary post-entity">Submit</button>
						</div>
						<div class="col-6 text-start ps-2">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</div>
				</form>
			</div>
		</div>
	</div>
	<script>
	window.entityDtoBuilders = window.entityDtoBuilders || {};
	window.entityDtoBuilders.customerOrder = function (form) {
	  return {   
	    id: form.querySelector('.entity-id')?.value,
   		invoiceDate: form.querySelector('.invoice-date')?.value,  
   		dueDate: form.querySelector('.due-date')?.value,
   		tax: form.querySelector('.tax')?.value,
   		shipping: form.querySelector('.shipping')?.value,
   		amountDue: form.querySelector('.amount-due')?.value
	  };
	};
</script>
