<!DOCTYPE html>
<!-- /templates/modal/edit/employee.html -->
<div th:each="e : ${Employees}" th:if="${e.id != null}"
	th:attr="id='modalEditEmployee-' + ${e.id}"
	th:fragment="modalEditEmployee" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalEditEmployeeLabel-' + ${e.id}">Employee</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form th:id="|form-${e.id}|" th:action="@{/entity/employee}"
					method="post">
					<input type="hidden" th:value="${e.id}" th:id="|employee-${e.id}|"
						class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">First Name</div>
						<div class="col-10">
							<input type="text" th:value="${e.firstName}"
								class="first-name form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Last Name</div>
						<div class="col-10">
							<input type="text" th:value="${e.lastName}"
								class="last-name form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Email Address</div>
						<div class="col-10">
							<input type="text" th:value="${e.emailAddress}"
								class="email-address form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Job Title</div>
						<div class="col-10">
							<input type="text" th:value="${e.jobTitle}"
								class="job-title form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Business Phone</div>
						<div class="col-10">
							<input type="text" th:value="${e.businessPhone}"
								class="business-phone form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Home Phone</div>
						<div class="col-10">
							<input type="text" th:value="${e.homePhone}"
								class="home-phone form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Mobile Phone</div>
						<div class="col-10">
							<input type="text" th:value="${e.mobilePhone}"
								class="mobile-phone form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Fax Number</div>
						<div class="col-10">
							<input type="text" th:value="${e.faxNumber}"
								class="fax-number form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Address 1</div>
						<div class="col-10">
							<input type="text" th:value="${e.address1}"
								class="address1 form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Address 2</div>
						<div class="col-10">
							<input type="text" th:value="${e.address2}"
								class="address2 form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">City</div>
						<div class="col-10">
							<input type="text" th:value="${e.city}" class="city form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">State Province</div>
						<div class="col-10">
							<input type="text" th:value="${e.stateProvince}"
								class="state-province form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Zip Postal Code</div>
						<div class="col-10">
							<input type="text" th:value="${e.zipPostalCode}"
								class="zip-postal-code form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Country Region</div>
						<div class="col-10">
							<input type="text" th:value="${e.countryRegion}"
								class="country-region form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Notes</div>
						<div class="col-10">
							<input type="text" th:value="${e.notes}"
								class="notes form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Web Site Title</div>
						<div class="col-10">
							<input type="text" th:value="${e.webSiteTitle}"
								class="web-site-title form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Web Site Url</div>
						<div class="col-10">
							<input type="text" th:value="${e.webSiteUrl}"
								class="web-site-url form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Portrait Path</div>
						<div class="col-10">
							<input type="text" th:value="${e.portraitPath}"
								class="portrait-path form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Portrait Title</div>
						<div class="col-10">
							<input type="text" th:value="${e.portraitTitle}"
								class="portrait-title form-control" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<button type="button" class="btn btn-secondary post-Employee">Submit</button>
						</div>
						<div class="col">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</form>
			</div>

		</div>
	</div>
</div>

<script>
	window.entityDtoBuilders = window.entityDtoBuilders || {};
	window.entityDtoBuilders.employee = function (form) {
	  return {
	    id: form.querySelector('.entity-id').value ? form.querySelector('.entity-id').value : null,
	    firstName: form.querySelector('.first-name').value ? form.querySelector('.first-name').value : null,
		lastName: form.querySelector('.last-name').value ? form.querySelector('.last-name') : null,
	    emailAddress: form.querySelector('.email-address')?.value,
	    jobTitle: form.querySelector('.job-title')?.value,
	    businessPhone: form.querySelector('.business-phone')?.value,
	    homePhone: form.querySelector('.home-phone')?.value,
	    mobilePhone: form.querySelector('.mobile-phone')?.value,
	    faxNumber: form.querySelector('.fax-number')?.value,
	    address1: form.querySelector('.address1')?.value,
	    address2: form.querySelector('.address2')?.value,
	    city: form.querySelector('.city')?.value,
	    stateProvince: form.querySelector('.state-province')?.value,
	    zipPostalCode: form.querySelector('.zip-postal-code')?.value,
	    countryRegion: form.querySelector('.country-region')?.value,
	    notes: form.querySelector('.notes')?.value,
	    webSiteTitle: form.querySelector('.web-site-title')?.value,
	    webSiteUrl: form.querySelector('.web-site-url')?.value,
	    portraitPath: form.querySelector('.portrait-path')?.value,
	    portraitTitle: form.querySelector('.portrait-title')?.value
	  };
	};
</script>
