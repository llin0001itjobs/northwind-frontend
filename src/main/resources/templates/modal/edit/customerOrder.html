<!-- /templates/modal/edit/customerOrder.html -->
<div th:each="c : ${CustomerOrders}" th:if="${c.id != null}"
	th:attr="id='modalEditCustomerOrder-' + ${c.id}"
	th:fragment="modalEditCustomerOrder" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalEditCustomerOrderLabel-' + ${c.id}">Customer
					Order</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form th:id="|form-${c.id}|" th:action="@{/entity/customerOrder}"
					method="post">
					<input type="hidden" th:value="${c.id}"
						th:id="|customerOrder-${c.id}|" class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">Ship Name</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipName}"
								class="ship-name form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Address</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipAddress}"
								class="ship-address form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">City</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipCity}"
								class="ship-city form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">State Province</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipStateProvince}"
								class="ship-state-province form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Zip Postal Code</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipZipPostalCode}"
								class="ship-zip-postal-code form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Country Region</div>
						<div class="col-10">
							<input type="text" th:value="${c.shipCountryRegion}"
								class="ship-country-region form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Shipping Fee</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${c.shippingFee}"
								class="shipping-fee form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Order Date</div>
						<div class="col-10">
							<input type="date" th:value="${c.orderDate}"
								class="shipping-orderDate form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Paid Date</div>
						<div class="col-10">
							<input type="date" th:value="${c.paidDate}"
								class="shipping-paidDate form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Shipped Date</div>
						<div class="col-10">
							<input type="date" th:value="${c.shippedDate}"
								class="shippedDate form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Taxes</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${c.taxes}"
								class="taxes form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Payment Type</div>
						<div class="col-10">
							<input type="date" th:value="${c.paymentType}"
								class="payment-type form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Notes</div>
						<div class="col-10">
							<input type="text" th:value="${c.notes}"
								class="notes form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Tax Rate</div>
						<div class="col-10">
							<input type="number" step="0.1" th:value="${c.taxRate}"
								class="tax-rate form-control" />
						</div>
					</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary"
					data-bs-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
<script>
	window.entityDtoBuilders = window.entityDtoBuilders || {};
	window.entityDtoBuilders.customerOrder = function (form) {
	  return {   
	    id: form.querySelector('.entity-id')?.value,
   		shipName: form.querySelector('.ship-name')?.value,
   		shipAddress: form.querySelector('.ship-address')?.value,
   		shipCity: form.querySelector('.ship-city')?.value,
   		shipStateProvince: form.querySelector('.ship-state-province')?.value,
   		shipZipPostalCode: form.querySelector('.ship-zip-postal-code')?.value,  
   		shipCountryRegion: form.querySelector('.ship-country-region')?.value,
   		shippingFee: form.querySelector('.shipping-fee')?.value,
   		shippingOrderDate: form.querySelector('.shipping-orderDate')?.value,  
   		shippingPaidDate: form.querySelector('.shipping-paidDate')?.value,
   		shippedDate: form.querySelector('.shippedDate')?.value,
   		taxes: form.querySelector('.taxes')?.value,    
   		paymentType: form.querySelector('.payment-type')?.value,
   		notes: form.querySelector('.notes')?.value,
   		taxRate: form.querySelector('.tax-rate')?.value
	  };
	};
</script>
