<!DOCTYPE html>
<!-- /templates/modal/edit/orderDetail.html -->
<div th:each="o : ${OrderDetails}" th:if="${o.id != null}"
	th:attr="id='modalEditOrderDetail-' + ${o.id}"
	th:fragment="modalEditOrderDetail" class="modal modal-lg fade"
	data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
	aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"
					th:attr="id='modalEditOrderDetailLabel-' + ${o.id}">Order
					Detail</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form th:id="|form-${o.id}|" th:action="@{/entity/orderDetail}"
					method="post" data-entity-type="OrderDetail" class="post-entity">
					<input type="hidden" th:value="${o.id}"
						th:id="|orderDetail-${o.id}|" class="entity-id" />
					<div class="row align-items-end">
						<div class="row align-items-end">
							<div class="col-2">Quantity</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${o.quantity}"
									class="quantity form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Unit Price</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${o.unitPrice}"
									class="unit-price form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Discount</div>
							<div class="col-10">
								<input type="number" step="0.1" th:value="${o.discount}"
									class="discount form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Date Allocated</div>
							<div class="col-10">
								<input type="date" th:value="${o.dateAllocated}"
									class="date-allocated form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Order Status</div>
							<div class="col-10">
								<select th:value="${o.orderStatus}"
									class="order-status form-control" /> </select>
							</div>
						</div>
						<div class="row mt-3">
							<div class="col-6 text-end pe-2">
								<button type="button" class="btn btn-secondary post-entity">Submit</button>
							</div>
							<div class="col-6 text-start ps-2">
								<button type="button" class="btn btn-secondary"
									data-bs-dismiss="modal">Close</button>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script>
	window.entityDtoBuilders = window.entityDtoBuilders || {};
	window.entityDtoBuilders.orderDetail = function (form) {
	  return {   
	    id: form.querySelector('.entity-id')?.value,
		quantity: form.querySelector('.quantity')?.value,   		
		unitPrice: form.querySelector('.unit-price')?.value,    
		discount: form.querySelector('.discount')?.value,
		dateAllocated: form.querySelector('.date-allocated')?.value,
		orderStatus: form.querySelector('.order-status')?.value
	  };
	};
</script>
