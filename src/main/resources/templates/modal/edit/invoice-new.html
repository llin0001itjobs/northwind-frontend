<!DOCTYPE html>
<!-- /templates/modal/edit/invoice-new.html -->
<div id="modalEditInvoice-new" th:fragment="modalEditInvoice-new"
	class="modal modal-lg fade" data-bs-backdrop="static"
	data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalEditInvoiceLabel-new">Invoice</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="form-invoice-new" th:action="@{/entity/invoice}"
					method="post" data-entity-type="Invoice" class="post-entity">
					<input type="hidden" name="id" value="0" class="entity-id" />
					<div class="row align-items-end">
						<div class="col-2">Invoice Date</div>
						<div class="col-10">
							<input type="date" name="invoiceDate"
								class="invoice-date form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Due Date</div>
						<div class="col-10">
							<input type="date" name="dueDate" class="due-date form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Tax</div>
						<div class="col-10">
							<input type="number" step="0.1" name="tax"
								class="tax form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Shipping</div>
						<div class="col-10">
							<input type="number" step="0.1" name="shipping"
								class="shipping form-control" />
						</div>
					</div>
					<div class="row align-items-end">
						<div class="col-2">Amount Due</div>
						<div class="col-10">
							<input type="number" step="0.1" name="amountDue"
								class="amount-due form-control" />
						</div>
					</div>
					<div class="row mt-3">
						<div class="col-6 text-end pe-2">
							<button type="button" class="btn btn-secondary post-entity">Submit</button>
						</div>
						<div class="col-6 text-start ps-2">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
