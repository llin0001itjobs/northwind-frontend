<!DOCTYPE html>
<!-- /templates/modal/edit/inventoryTransaction-new.html -->
<div id="modalEditInventoryTransaction-new"
	th:fragment="modalEditInventoryTransaction-new"
	class="modal modal-lg fade" data-bs-backdrop="static"
	data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalEditInventoryTransactionLabel-new">InventoryTransaction</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"
					aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="form-inventoryTransaction-new"
					th:action="@{/entity/inventoryTransaction}" method="post"
					data-entity-type="InventoryTransaction" class="post-entity">
					<input type="hidden" name="id" value="0" class="entity-id" />
					<div class="modal-body">
						<div class="row align-items-end">
							<div class="col-2">Created Date</div>
							<div class="col-10">
								<input type="date" readonly="readonly" name="transactionCreatedDate"
									class="transactionCreatedDate form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Modified Date</div>
							<div class="col-10">
								<input type="date" readonly="readonly" name="transactionModifiedDate"
									class="transactionModifiedDate form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Quantity</div>
							<div class="col-10">
								<input type="number" step="1.0" name="quantity"
									class="quantity form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Comments</div>
							<div class="col-10">
								<input type="text" name="comments" class="comments form-control" />
							</div>
						</div>
						<div class="row align-items-end">
							<div class="col-2">Inventory Transaction Type</div>
							<div class="col-10">
								<select name="inventoryTransactionType"
									class="inventory-transaction-type form-control">
								</select>
							</div>
						</div>
						<div class="row mt-3">
							<div class="col-6 text-end pe-2">
								<button type="button" class="btn btn-secondary post-entity">Submit</button>
							</div>
							<div class="col-6 text-start ps-2">
								<button type="button" class="btn btn-secondary"
									data-bs-dismiss="modal">Close</button>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
