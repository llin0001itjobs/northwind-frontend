<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>

</head>
<body>
	<main>
		<div class="container-fluid">
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="~{fragments/navbar :: nav}"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="~{fragments/sideMenuLeftEntities :: div}"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table
								class="table table-striped table-borderless fw-normal pb-1 small mb-0 w-100"
								id="dataTable" th:data-page-length="${_PAGE_LENGTH ?: 7}">
								<thead>
									<tr>
										<th scope="col" class="col-1">&nbsp;</th>
										<th scope="col">Name</th>
										<th scope="col">Job Title</th>
										<th scope="col">Company</th>
										<th scope="col">Notes</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="e, status : ${Employees}">
									<td class="py-2"><input type="radio" th:name="radioId"
										th:id="|radioId_${e.id}|" th:value="${e.id}"
										th:checked="${status.index == 0}"></input></td>									
										<td><span th:text="${e.firstName}"></span> &nbsp; <span
											th:text="${e.lastName}"></span></td>
										<td th:text="${e.company.name}"></td>
										<td th:text="${e.jobTitle}"></td>
										<td><span th:text="${e.notes}"></span></td>
									</tr>
								</tbody>
							</table>
							<!-- Keep the Thymeleaf fragment markup hidden inside a template tag so DataTables can grab it via JS -->
							<template id="crudButtonsTemplate">
								<div th:replace="~{fragments/topMenuCRUD :: topMenuCRUD}"></div>
							</template>
						</div>
						<div class="col-2 bg-light border border-primary"
							id="rightSideBar">
							<div th:replace="~{fragments/sideMenuRight :: sideMenuRight}"></div>
						</div>
					</div>
				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="~{fragments/footer :: footer}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/links-js :: linksJs}"></div>

</body>
</html>
