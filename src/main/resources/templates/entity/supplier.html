
<!DOCTYPE html>
<!-- entity/supplier.html -->
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">

<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>
<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>
</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="~{modal/child/supplier/product :: div}"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="~{fragments/navbar :: nav}"></div>
				</div>
			</div>
			<div class="row border">
				<div class="row">
					<div class="col-2 bg-light border border-primary pb-3"
						id="leftSideBar">
						<div th:replace="~{fragments/sideMenuLeftEntities :: div}"></div>
					</div>
					<div class="col-8 border border-primary mt-5 pt-4">
						<h3>
							<span th:text="${TITLE}"></span>
						</h3>
						<table class="table" id="dataTable">
							<thead>
								<tr>
									<th scope="col">Contact</th>
									<th scope="col">Job Title</th>
									<th scope="col">Email Address</th>
									<th scope="col">Business Phone</th>
									<th scope="col">Company</th>
									<th scope="col">Links</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="s : ${Suppliers}">
									<td><span th:text="${s.lastName}"></span>, <span
										th:text="${s.firstName}"></span></td>
									<td th:text="${s.jobTitle}"></td>
									<td th:text="${s.emailAddress}"></td>
									<td th:text="${s.businessPhone}"></td>
									<td th:text="${s.company.name}"></td>
									<td>
										<div th:each="l: ${s.links}">
											<div th:if="${s.links != null}">
												<div th:with="productLink=${s.links.getLink('products')}">
													<!-- If product link exists, show the modal trigger -->
													<a th:if="${productLink != null}" href="#"
														data-bs-toggle="modal"
														th:attr="data-bs-target='#modalProduct-' + ${s.id}">
														products</a>

													<!-- If product link is missing, show "No Products Info" -->
													<span th:unless="${productLink != null}" class="text-muted">No
														Products Info</span>
												</div>
											</div>
										</div>
									</td>
								</tr>
							</tbody>
						</table>

					</div>
					<div class="col-2 bg-light border border-primary pb-3"
						id="rightSideBar">
						<div th:replace="~{fragments/sideMenuRight :: div}"></div>
					</div>
				</div>

				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="~{fragments/footer :: footer}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/links-js :: linksJs}"></div>
</body>
</html>
