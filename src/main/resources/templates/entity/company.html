<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>
<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>
<script>
	function onClick(e) {
		// e can be the button element (if you pass `this`) or the event object
		const button = e.target ? e.target : e;
		const buttonName = button.dataset.action || button.id
				|| button.textContent.trim();

		// Get the currently selected radio
		const selectedRadio = document
				.querySelector('input[name="radioId"]:checked');
		const selectedId = selectedRadio ? selectedRadio.value : null;
		const radioId = selectedRadio ? selectedRadio.id : null;

		console.log({
			button : buttonName,
			selectedId : selectedId,
			radioId : radioId
		});

		// Optional: show an alert while you debug
		alert(`Button: ${buttonName}\nSelected ID: ${selectedId || 'none'}\nRadio ID: ${radioId || 'none'}`);
	}

	document.addEventListener('click', function(e) {
		const btn = e.target.closest('[data-action]'); // or closest('button')
		if (!btn)
			return;

		// Only react to the four CRUD buttons
		const action = btn.dataset.action;
		if ([ 'view', 'add', 'edit', 'del' ].includes(action)) {
			onClick(btn); // or onClick(e) if you prefer the event object
		}
	});
</script>
</head>
<body>
	<div class="container-fluid h-100">
		<div class="row" id="navBarRow">
			<div class="col-12" id="navBarCol">
				<div th:replace="~{fragments/navbar :: nav}"></div>
			</div>
		</div>
		<div class="row">
			<div class="col-2 bg-light border border-primary" id="leftSideBar">
				<div
					th:replace="~{fragments/sideMenuLeftEntities :: sideMenuLeftEntities}"></div>
			</div>
			<div class="col-8 border border-primary mt-5 pt-4">
				<h3>
					<span th:text="${TITLE}"></span>
				</h3>

				<!-- Keep this container completely clean. Let DataTables 2.x inject everything naturally -->
				<table
					class="table table-striped table-borderless fw-normal pb-1 small mb-0 w-100"
					id="dataTable">
					<thead class="border-top border-bottom border-secondary">
						<tr>
							<th scope="col" class="col-1">&nbsp;</th>
							<th scope="col" class="col-11">Name</th>
						</tr>
					</thead>
					<tbody class="font-data">
						<tr th:each="c, status : ${Companies}">
							<td class="py-2"><input type="radio" th:name="radioId"
								th:id="|radioId_${c.id}|" th:value="${c.id}"
								th:checked="${status.index == 0}"></input></td>
							<td class="py-2"><span th:text="${c.name}"></span></td>
						</tr>
					</tbody>
				</table>

				<!-- Keep the Thymeleaf fragment markup hidden inside a template tag so DataTables can grab it via JS -->
				<template id="crudButtonsTemplate">
					<div th:replace="~{fragments/topMenuCRUD :: topMenuCRUD}"></div>
				</template>
			</div>
			<div class="col-2 bg-light border border-primary" id="rightSideBar">
				<div th:replace="~{fragments/sideMenuRight :: sideMenuRight}"></div>
			</div>
		</div>

	</div>
	<div class="row" id="footerRow">
		<div class="col-12" id="footerCol">
			<div th:replace="~{fragments/footer :: footer}"></div>
		</div>
	</div>
	</div>
	<div th:replace="~{fragments/links-js :: linksJs}"></div>
</body>
</html>
