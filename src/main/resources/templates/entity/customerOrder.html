
<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="~{modal/child/customerOrder/customer :: div}"></div>
			<div th:replace="~{modal/child/customerOrder/employee :: div}"></div>
			<div th:replace="~{modal/child/customerOrder/shipper :: div}"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="~{fragments/navbar :: nav}"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="~{fragments/sideMenuLeftEntities :: div}"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table class="table" id="dataTable">
								<thead>
									<tr>
										<th scope="col">Order Date</th>
										<th scope="col">Paid Date</th>
										<th scope="col">Phone</th>
										<th scope="col">Contact</th>
										<th scope="col">City</th>
										<th scope="col">State</th>
										<th scope="col">Order Status</th>
										<th scope="col">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="co : ${CustomerOrders}">
										<td><span th:text="${co.orderDate}"></span></td>
										<td><span th:text="${co.paidDate}"></span></td>
										<td><span th:text="${co.shippedDate}"></span></td>
										<td><span th:text="${co.shipName}"></span></td>
										<td><span th:text="${co.shipCity}"></span></td>
										<td><span th:text="${co.shipStateProvince}"></span></td>
										<td><span th:text="${co.orderStatus.statusName}"></span></td>									
										<td>
											<div th:each="l: ${co.links}">
												<div th:if="${co.links != null}">
													<div th:with="customerLink=${co.links.getLink('customer')}">
														<a th:if="${customerLink != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalCustomer-' + ${co.id}">
															customer</a>
														<span th:unless="${customerLink != null}"
															class="text-muted">No Customer Info</span>
													</div>
													<div th:with="employeeLink=${co.links.getLink('employee')}">
														<a th:if="${employeeLink != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalEmployee-' + ${co.id}">
															employee</a>
														<span th:unless="${employeeLink != null}"
															class="text-muted">No Employee Info</span>
													</div>
													<div th:with="shipperLink=${co.links.getLink('shipper')}">
														<a th:if="${shipperLink != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalShipper-' + ${co.id}">
															shipper</a>
															
													
														<span th:unless="${shipperLink != null}"
															class="text-muted">No Shipper Info</span>
													</div>												
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="~{fragments/sideMenuRight :: div}"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="~{fragments/footer :: footer}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/links-js :: linksJs}"></div>
</body>
</html>
