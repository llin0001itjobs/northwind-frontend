<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">

<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>


<th:block th:replace="fragments/links-css :: linksCss"></th:block>

</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="modal/child/customerOrder/customer :: div"></div>
			<div th:replace="modal/child/customerOrder/employee :: div"></div>
			<div th:replace="modal/child/customerOrder/orderStatus :: div"></div>
			<div th:replace="modal/child/customerOrder/orderTaxStatus :: div"></div>
			<div th:replace="modal/child/customerOrder/shipper :: div"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="fragments/navbar :: nav"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="fragments/sideMenuLeftEntities :: div"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table class="table" id="dataTable">
								<thead>
									<tr>
										<th scope="col-2">Order Date</th>
										<th scope="col-2">Paid Date</th>
										<th scope="col-2">Shipped Date</th>
										<th scope="col">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="c : ${CustomerOrders}">
										<td><span
											th:text="${#temporals.format(c.orderDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td><span
											th:text="${#temporals.format(c.getPaidDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td><span
											th:text="${#temporals.format(c.shippedDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td>
											<div>
												<a
													th:href="'/modal/show?entity=customer&id=' + ${c.links.getLink('customer').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalCustomer-' + ${c.links.getLink('customer').id}"><span
													th:text="${c.links.getLink('customer').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${c.links.getLink('employee').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=employee&id=' + ${c.links.getLink('employee').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalEmployee-' + ${c.links.getLink('employee').id}"><span
													th:text="${c.links.getLink('employee').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${c.links.getLink('shipper').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=shipper&id=' + ${c.links.getLink('shipper').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalShipper-' + ${c.links.getLink('shipper').id}"><span
													th:text="${c.links.getLink('shipper').label}"></span></a>
											</div>
											<div>
												<a
													th:href="'/modal/show?entity=orderStatus&id=' + ${c.links.getLink('orderStatus').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalOrderStatus-' + ${c.links.getLink('orderStatus').id}"><span
													th:text="${c.links.getLink('orderStatus').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${c.links.getLink('orderTaxStatus').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=orderTaxStatus&id=' + ${c.links.getLink('orderTaxStatus').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalOrderTaxStatus-' + ${c.links.getLink('orderTaxStatus').id}"><span
													th:text="${c.links.getLink('orderTaxStatus').label}"></span></a>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="fragments/sideMenuRight :: div"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="fragments/footer :: footer"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments/links-js-page-length-7 :: linksJs"></div>

</body>
</html>
