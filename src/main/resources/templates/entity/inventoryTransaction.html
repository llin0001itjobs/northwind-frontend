<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">


<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div
				th:replace="~{modal/child/inventoryTransaction/customerOrder :: div}"></div>
			<div th:replace="~{modal/child/inventoryTransaction/product :: div}"></div>
			<div
				th:replace="~{modal/child/inventoryTransaction/purchaseOrder :: div}"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="~{fragments/navbar :: nav}"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="~{fragments/sideMenuLeftEntities :: div}"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table
								class="table table-striped table-borderless fw-normal pb-1 small mb-0 w-100"
								id="dataTable" th:data-page-length="${_PAGE_LENGTH ?: 8}">
								<thead>
									<tr>
										<th scope="col" class="col-1">&nbsp;</th>
										<th scope="col" class="col-2">Created Date</th>
										<th scope="col" class="col-2">Modified Date</th>
										<th scope="col" class="col-2">Type</th>
										<th scope="col" class="col-1">Quantity</th>
										<th scope="col" class="col-2">Comments</th>
										<th scope="col" class="col-2">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="i, status : ${InventoryTransactions}">
										<td class="py-2 text-center"><input type="radio" th:name="radioId"
											th:id="|radioId_${i.id}|" th:value="${i.id}"
											th:checked="${status.index == 0}"></input></td>
										<td
											th:text="${i.transactionCreatedDate != null} ? ${#temporals.format(i.transactionCreatedDate, 'yyyy-MM-dd')} : ''"></td>
										<td
											th:text="${i.transactionModifiedDate != null} ? ${#temporals.format(i.transactionModifiedDate, 'yyyy-MM-dd')} : ''"></td>
										<td><span
											th:text="${i.inventoryTransactionType.typeName}"></span></td>
										<td
											th:text="${i.quantity != null && i.quantity != 0} ? ${#numbers.formatDecimal(i.quantity, 1, 2)} : ''"></td>
										<td th:text="${i.comments} ?: ''"></td>
										<td>
											<div class="modal-anchor" th:each="l: ${i.links}">
												<div th:if="${i.links != null}">
													<div class="modal-anchor"
														th:with="customerOrderLink=${i.links.getLink('customerOrder')}">
														<a th:if="${customerOrderLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalCustomerOrder-' + ${i.id}">
															Customer Order</a> <span
															th:unless="${customerOrderLink.id != null}"
															class="text-muted">No Customer Order Info</span>
													</div>
													<div th:with="productLink=${i.links.getLink('product')}">
														<a th:if="${productLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalProduct-' + ${i.id}">
															Product</a> <span th:unless="${productLink.id != null}"
															class="text-muted">No Product Info</span>
													</div>
													<div
														th:with="purchaseOrderLink=${i.links.getLink('purchaseOrder')}">
														<a th:if="${purchaseOrderLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalPurchaseOrder-' + ${i.id}">
															Purchase Order</a> <span
															th:unless="${purchaseOrderLink.id != null}"
															class="text-muted">No Purchase Order Info</span>
													</div>
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
							<!-- Keep the Thymeleaf fragment markup hidden inside a template tag so DataTables can grab it via JS -->
							<template id="crudButtonsTemplate">
								<div th:replace="~{fragments/topMenuCRUD :: topMenuCRUD}"></div>
							</template>
						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="~{fragments/sideMenuRight :: div}"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="~{fragments/footer :: footer}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/links-js :: linksJs}"></div>

</body>
</html>
