<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">


<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="fragments/links-css :: linksCss"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div
				th:replace="modal/child/inventoryTransaction/customerOrder :: div"></div>
			<div th:replace="modal/child/inventoryTransaction/product :: div"></div>
			<div
				th:replace="modal/child/inventoryTransaction/purchaseOrder :: div"></div>
			<div
				th:replace="modal/child/inventoryTransaction/InventoryTransactionType :: div"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="fragments/navbar :: nav"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="fragments/sideMenuLeftEntities :: div"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table class="table" id="dataTable">
								<thead>
									<tr>
										<th scope="col">Created Date</th>
										<th scope="col">Modified Date</th>
										<th scope="col">Quantity</th>
										<th scope="col">Comments</th>
										<th scope="col">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="i : ${InventoryTransactions}">
										<td><span th:text="${i.transactionCreatedDate}"></span></td>
										<td><span th:text="${i.transactionModifiedDate}"></span></td>
										<td><span th:text="${i.quantity}"></span></td>
										<td><span th:text="${i.comments}"></span></td>
										<td>
											<div>
												<a
													th:href="'/modal/show?entity=transactionType&id=' + ${i.links.getLink('transactionType').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalTransactionType-' + ${i.links.getLink('transactionType').id}"><span
													th:text="${i.links.getLink('transactionType').label}"></span></a>
											</div>
											<div>
												<a
													th:href="'/modal/show?entity=product&id=' + ${i.links.getLink('product').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalProduct-' + ${i.links.getLink('product').id}"><span
													th:text="${i.links.getLink('product').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${i.links.getLink('customerOrder').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=customerOrder&id=' + ${i.links.getLink('customerOrder').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalCustomerOrder-' + ${i.links.getLink('customerOrder').id}"><span
													th:text="${i.links.getLink('customerOrder').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${i.links.getLink('purchaseOrder').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=purchaseOrder&id=' + ${i.links.getLink('purchaseOrder').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalPurchaseOrder-' + ${i.links.getLink('purchaseOrder').id}"><span
													th:text="${i.links.getLink('purchaseOrder').label}"></span></a>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="fragments/sideMenuRight :: div"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="fragments/footer :: footer"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments/links-js :: linksJs"></div>

</body>
</html>
