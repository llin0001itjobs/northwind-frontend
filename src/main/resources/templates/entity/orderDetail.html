
<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="~{fragments/links-css :: linksCss}"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="~{modal/child/orderDetail/customerOrder :: div}"></div>
			<div th:replace="~{modal/child/orderDetail/inventoryTransaction :: div}"></div>			
			<div th:replace="~{modal/child/orderDetail/product :: div}"></div>
			<div th:replace="~{modal/child/orderDetail/purchaseOrder :: div}"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="~{fragments/navbar :: nav}"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="~{fragments/sideMenuLeftEntities :: div}"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table class="table" id="dataTable">
								<thead>
									<tr>
										<th scope="col">Quantity</th>
										<th scope="col">Unit Price</th>
										<th scope="col">Discount</th>
										<th scope="col">Order Status</th>										
										<th scope="col">Date Allocated</th>
										<th scope="col">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="o : ${OrderDetails}">
										<td><span th:text="${o.quantity}"></span></td>
										<td><span th:text="${o.unitPrice}"></span></td>
										<td><span th:text="${o.discount}"></span></td>
										<td><span th:text="${o.orderStatus.statusName}"></span></td>
										<td
											th:text="${o.dateAllocated != null} ? ${#temporals.format(o.dateAllocated, 'MM-dd-yyyy')} : ''"></td>										
										<td>
											<div th:each="l: ${o.links}">
												<div th:if="${o.links != null}">
													<div
														th:with="customerOrderLink=${o.links.getLink('customerOrder')}">
														<a th:if="${customerOrderLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalCustomerOrder-' + ${o.id}">
															Customer Order</a> <span
															th:unless="${customerOrderLink.id != null}"
															class="text-muted">No Customer Order Info</span>
													</div>
													<div
														th:with="inventoryTransactionLink=${o.links.getLink('inventoryTransaction')}">
														<a th:if="${inventoryTransactionLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalInventoryTransaction-' + ${o.id}">
															Inventory Transaction</a> <span
															th:unless="${inventoryTransactionLink.id != null}"
															class="text-muted">No Inventory Transaction Info</span>
													</div>													
													<div th:with="productLink=${o.links.getLink('product')}">
														<a th:if="${productLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalProduct-' + ${o.id}">
															Product</a> <span th:unless="${productLink.id != null}"
															class="text-muted">No Product Info</span>
													</div>
													<div
														th:with="purchaseOrderLink=${o.links.getLink('purchaseOrder')}">
														<a th:if="${purchaseOrderLink.id != null}" href="#"
															data-bs-toggle="modal"
															th:attr="data-bs-target='#modalPurchaseOrder-' + ${o.id}">
															Purchase Order</a> <span
															th:unless="${purchaseOrderLink.id != null}"
															class="text-muted">No Purchase Order Info</span>
													</div>
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="~{fragments/sideMenuRight :: div}"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="~{fragments/footer :: footer}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/links-js-page-length-7 :: linksJs}"></div>

</body>
</html>
