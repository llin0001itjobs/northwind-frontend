
<!DOCTYPE html>
<!-- entity/product.html -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>

<th:block th:replace="fragments/links-css :: linksCss"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="modal/child/product/supplier :: div"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="fragments/navbar :: nav"></div>
				</div>
			</div>
			<div class="row border">
				<div class="row">
					<div class="col-2 bg-light border border-primary pb-3"
						id="leftSideBar">
						<div th:replace="fragments/sideMenuLeftEntities :: div"></div>
					</div>
					<div class="col-8 border border-primary mt-5 pt-4">
						<h3>
							<span th:text="${TITLE}"></span>
						</h3>
						<table class="table" id="dataTable">
							<thead>
								<tr>
									<th scope="col">Product Code</th>
									<th scope="col">Product Name</th>
									<th scope="col">Category</th>
									<th scope="col">Standard Cost</th>
									<th scope="col">List Price</th>
									<th scope="col">Quantity Per Unit</th>
									<th scope="col">Minimum Reorder Quantity</th>
									<th scope="col">Links</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="p : ${Products}">
									<td><span th:text="${p.productCode}"></span></td>
									<td><span th:text="${p.productName}"></span></td>
									<td><span th:text="${p.category}"></span></td>
									<td><span th:text="${p.standardCost}"></span></td>
									<td><span th:text="${p.listPrice}"></span></td>
									<td><span th:text="${p.quantityPerUnit}"></span></td>
									<td><span th:text="${p.minimumReorderQuantity}"></span></td>
									<td>
										<div th:if="${p.links != null}">
											<div th:with="supplierLink=${p.links.getLink('suppliers')}">
												<a th:if="${supplierLink != null}" href="#"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalSupplier-' + ${p.id}">
													suppliers</a>
											</div>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="col-2 bg-light border border-primary pb-3"
						id="rightSideBar">
						<div th:replace="fragments/sideMenuRight :: div"></div>
					</div>
				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="fragments/footer :: footer"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments/links-js :: linksJs"></div>

</body>
</html>
