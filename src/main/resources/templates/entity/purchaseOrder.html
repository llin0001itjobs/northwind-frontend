
<!DOCTYPE html>
<!-- saved from url=(0052)https://getbootstrap.com/docs/5.0/examples/sidebars/ -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Northwind Traders</title>

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

<th:block th:replace="fragments/links-css :: linksCss"></th:block>


</head>
<body>
	<main>
		<div class="container-fluid">
			<div th:replace="modal/child/purchaseOrder/approvedBy :: div"></div>
			<div th:replace="modal/child/purchaseOrder/createdBy :: div"></div>
			<div th:replace="modal/child/purchaseOrder/orderStatus :: div"></div>
			<div th:replace="modal/child/purchaseOrder/submittedBy :: div"></div>
			<div th:replace="modal/child/purchaseOrder/supplier :: div"></div>
			<div class="row" id="navBarRow">
				<div class="col-12" id="navBarCol">
					<div th:replace="fragments/navbar :: nav"></div>
				</div>
			</div>
			<div class="row border">
				<div class="container-fluid">
					<div class="row">
						<div class="col-2 bg-light border border-primary pb-3"
							id="leftSideBar">
							<div th:replace="fragments/sideMenuLeftEntities :: div"></div>
						</div>
						<div class="col-8 border border-primary mt-5 pt-4">
							<h3>
								<span th:text="${TITLE}"></span>
							</h3>
							<table class="table" id="dataTable">
								<thead>
									<tr>
										<th scope="col">Approved Date</th>
										<th scope="col">Submitted Date</th>
										<th scope="col">Creation Date</th>
										<th scope="col">Links</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="p : ${PurchaseOrders}">

										<td><span
											th:text="${#temporals.format(p.approvedDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td><span
											th:text="${#temporals.format(p.submittedDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td><span
											th:text="${#temporals.format(p.creationDate, 'dd-MM-yyyy HH:mm')}"></span></td>
										<td>
											<div>
												<a
													th:href="'/modal/show?entity=orderStatus&id=' + ${p.links.getLink('orderStatus').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalOrderStatus-' + ${p.links.getLink('orderStatus').id}"><span
													th:text="${p.links.getLink('orderStatus').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${p.links.getLink('supplier').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=supplier&id=' + ${p.links.getLink('supplier').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalSupplier-' + ${p.links.getLink('supplier').id}"><span
													th:text="${p.links.getLink('supplier').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${p.links.getLink('approvedBy').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=approvedBy&id=' + ${p.links.getLink('approvedBy').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalApprovedBy-' + ${p.links.getLink('approvedBy').id}"><span
													th:text="${p.links.getLink('approvedBy').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${p.links.getLink('createdBy').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=createdBy&id=' + ${p.links.getLink('createdBy').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalCreatedBy-' + ${p.links.getLink('createdBy').id}"><span
													th:text="${p.links.getLink('createdBy').label}"></span></a>
											</div>
											<div
												th:with="isNullId=${p.links.getLink('submittedBy').id == null}">
												<a th:if="${!isNullId}"
													th:href="'/modal/show?entity=submittedBy&id=' + ${p.links.getLink('submittedBy').id}"
													data-bs-toggle="modal"
													th:attr="data-bs-target='#modalSubmittedBy-' + ${p.links.getLink('submittedBy').id}"><span
													th:text="${p.links.getLink('submittedBy').label}"></span></a>
											</div>
										</td>
									</tr>
								</tbody>
							</table>

						</div>
						<div class="col-2 bg-light border border-primary pb-3"
							id="rightSideBar">
							<div th:replace="fragments/sideMenuRight :: div"></div>
						</div>
					</div>


				</div>
				<div class="row" id="footerRow">
					<div class="col-12" id="footerCol">
						<div th:replace="fragments/footer :: footer"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragments/links-js-page-length-6 :: linksJs"></div>

</body>
</html>
